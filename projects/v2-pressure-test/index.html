<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V2 Phase 1 压力样稿（真实模板运行）</title>
  <style>
    :root { color-scheme: dark; --bg: #10111a; --surface: #171824; --text: #ededf5; --muted: #9898a8; --line: rgba(255,255,255,.12); --accent: #f0b93c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    header, main { width: min(100% - 2rem, 1920px); margin-inline: auto; }
    header { padding: 2rem 0 1rem; }
    header p { max-width: 70ch; color: var(--muted); line-height: 1.6; }
    .case { margin: 1rem 0 3rem; }
    .case h2 { margin: 0 0 .65rem; color: var(--accent); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
    iframe { display: block; width: 100%; height: min(86svh, 900px); border: 1px solid var(--line); background: var(--surface); }
    @media (max-width: 700px) { header, main { width: min(100% - 1rem, 1920px); } iframe { height: 78svh; min-height: 620px; } }
  </style>
</head>
<body>
  <header>
    <h1>V2 Phase 1 压力样稿</h1>
    <p>以下七个案例均在真实 <code>template.html</code> 中运行，再注入明确标记的合成内容。用于检查长标题、长数字、来源脚注、密集比较和窄屏重排；不代表真实业务事实。</p>
  </header>
  <main>
    <section class="case"><h2>Cover · 中文长标题</h2><iframe title="Cover pressure test" src="../../template.html?slide=1&amp;embed=1" onload="applyCase(this, 'cover')"></iframe></section>
    <section class="case"><h2>Agenda · 六段叙事目录</h2><iframe title="Agenda pressure test" src="../../template.html?slide=2&amp;embed=1" onload="applyCase(this, 'agenda')"></iframe></section>
    <section class="case"><h2>Metrics · 长数字与口径</h2><iframe title="Metrics pressure test" src="../../template.html?slide=3&amp;embed=1" onload="applyCase(this, 'metrics')"></iframe></section>
    <section class="case"><h2>Dashboard · 长日期与责任信息</h2><iframe title="Dashboard pressure test" src="../../template.html?slide=4&amp;embed=1" onload="applyCase(this, 'dashboard')"></iframe></section>
    <section class="case"><h2>Split · 证据与结论</h2><iframe title="Split pressure test" src="../../template.html?slide=5&amp;embed=1" onload="applyCase(this, 'split')"></iframe></section>
    <section class="case"><h2>Detail · 双层注释</h2><iframe title="Detail pressure test" src="../../template.html?slide=9&amp;embed=1" onload="applyCase(this, 'detail')"></iframe></section>
    <section class="case"><h2>Compare · 密集比较</h2><iframe title="Compare pressure test" src="../../template.html?slide=11&amp;embed=1" onload="applyCase(this, 'compare')"></iframe></section>
  </main>

  <template id="case-cover">
    <div class="cover-deco" aria-hidden="true"></div><div class="cover-datastream" aria-hidden="true"><span></span><span></span><span></span></div>
    <h1><span class="text-gradient">跨区域供应链协同</span><br>与异常处置透明度，成为董事会必须看懂的唯一问题</h1>
    <p class="subtitle">合成演示：验证中文长标题、范围、作者与日期在多种屏幕比例下仍有明确层级。</p>
    <p class="meta"><span>2026-08-07</span><span>Pressure Test Team</span><span>非真实业务事实</span></p>
  </template>

  <template id="case-agenda">
    <header class="slide-header"><h4>目录</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>目录必须承受长标题，同时仍能看出先后与权重。</h2><p class="evidence-rail">序列代表论证顺序，不代表六个主题等权</p><div class="agenda-grid">
        <article class="agenda-item"><span class="agenda-num">01</span><h3>决策框架</h3><p>确认谁需要在什么时间、基于什么信息作出选择。</p></article>
        <article class="agenda-item"><span class="agenda-num">02</span><h3>异常信号</h3><p>只保留能改变判断的证据，不以装饰填满页面。</p></article>
        <article class="agenda-item"><span class="agenda-num">03</span><h3>数据口径</h3><p>说明时间窗、单位、版本与缺失值处理方法。</p></article>
        <article class="agenda-item"><span class="agenda-num">04</span><h3>替代解释</h3><p>区分直接观察、推断以及尚未证实的假设。</p></article>
        <article class="agenda-item"><span class="agenda-num">05</span><h3>建议动作</h3><p>给出动作边界、责任人和能够推翻结论的条件。</p></article>
        <article class="agenda-item"><span class="agenda-num">06</span><h3>下一复核</h3><p>记录 2026-08-07T23:59:59.999+08:00 的下一检查点。</p></article>
      </div></div>
  </template>

  <template id="case-metrics">
    <header class="slide-header"><h4>指标</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>异常长数字不能牺牲主结论。</h2><p class="evidence-rail">单位 · 周期 · 来源 · 决策阈值</p><div class="metrics-row">
        <article class="metric-card"><div class="metric-value">12,345,678,901,234.56789</div><div class="metric-label">合成主指标（演示点）</div><p class="metric-desc">示范性累计值，并非真实财务、运营或市场数据。</p><ul class="metric-supports"><li>口径：全量合成样本</li><li>比较基线：上一个演示窗口</li><li>阈值：仅用于排版测试</li></ul></article>
        <article class="metric-card"><div class="metric-value">2026-08-07</div><div class="metric-label">复核日期</div><p class="metric-desc">验证日期在辅助区域的换行与对齐。</p></article>
        <article class="metric-card"><div class="metric-value">+0.0000001%</div><div class="metric-label">变化幅度</div><p class="metric-desc">验证极小比例仍可清晰读取。</p></article>
      </div></div>
  </template>

  <template id="case-dashboard">
    <header class="slide-header"><h4>状态总览</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>主状态先于证据网格。</h2><p class="evidence-rail">状态 · 来源 · 时间窗 · 限制 · 责任人</p><div class="stats-grid">
        <article class="stat-cell"><div><span class="stat-num">需复核</span><span class="stat-unit">状态</span></div><div class="stat-name">合成决策条件</div><p class="stat-context">当前信息足以发起复核，不足以形成外部结论。</p></article>
        <article class="stat-cell"><div><span class="stat-num">A</span><span class="stat-unit">来源</span></div><div class="stat-name">双层注释</div><p class="stat-context">合成数据集 A；采样说明 B。</p></article>
        <article class="stat-cell"><div><span class="stat-num">24h</span><span class="stat-unit">时间窗</span></div><div class="stat-name">完整时区</div><p class="stat-context">2026-08-07T00:00:00.000+08:00—23:59:59.999+08:00</p></article>
        <article class="stat-cell"><div><span class="stat-num">1</span><span class="stat-unit">限制</span></div><div class="stat-name">覆盖边界</div><p class="stat-context">未覆盖线下补录。</p></article>
        <article class="stat-cell"><div><span class="stat-num">09:30</span><span class="stat-unit">检查点</span></div><div class="stat-name">演示负责人</div><p class="stat-context">下一窗口复核来源与口径。</p></article>
      </div></div>
  </template>

  <template id="case-split">
    <header class="slide-header"><h4>证据与结论</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>结论与证据不能长得一样重。</h2><p class="evidence-rail">左侧记录 · 右侧解释与决策规则</p><div class="split-body">
        <ul class="insight-list"><li>合成样本显示连续三次阈值外波动。</li><li>来源脚注记录的时区与版本可以追溯。</li><li>长数字和日期在窄屏仍需完整访问。</li></ul>
        <div><div class="split-highlight">建议先执行限定范围复核；若下一窗口仍异常，再升级为正式决策。</div><div class="mini-stat-row"><div class="mini-stat"><div class="mini-val">01</div><div class="mini-label">观察</div></div><div class="mini-stat"><div class="mini-val">02</div><div class="mini-label">推断</div></div><div class="mini-stat"><div class="mini-val">03</div><div class="mini-label">决策</div></div></div><p class="source-note">双层注释：这是演示判断；不应据此采取真实业务行动。</p></div>
      </div></div>
  </template>

  <template id="case-detail">
    <header class="slide-header"><h4>详情</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>双层注释应形成阅读轨，而不是圆角卡片堆。</h2><p class="evidence-rail">结论 · 动作 · 证据 · 限制</p><div class="detail-body">
        <div class="detail-col"><article class="detail-block"><h3>结论</h3><p>暂不扩大范围。</p></article><article class="detail-block"><h3>动作</h3><p>复核来源与口径。</p></article></div>
        <div class="detail-col"><article class="detail-block"><h3>证据</h3><p>合成记录 2026-08-07T08:30:00.123+08:00 保留日期、毫秒和时区。</p></article><article class="detail-block"><h3>限制</h3><p>本页所有主体、金额、状态与来源名称均为合成演示内容。</p></article></div>
      </div></div>
  </template>

  <template id="case-compare">
    <header class="slide-header"><h4>比较</h4><span class="tag">合成演示</span></header><div class="slide-content">
      <h2>密集比较表应先显示差异，再显示推荐。</h2><p class="evidence-rail">推荐行由字重与细金线标记，不使用大面积色块</p>
      <div class="compare-scroll" role="region" aria-label="合成方案比较表" tabindex="0"><table class="compare-table"><thead><tr><th>选项</th><th>可读性</th><th>风险</th><th>验证动作</th></tr></thead><tbody><tr><td>方案 A · 推荐</td><td>主结论、证据、来源三层分明。</td><td>需要明确阈值。</td><td>回放 SYN-0000000000001。</td></tr><tr><td>方案 B</td><td>保留更多上下文。</td><td>密度可能掩盖重点。</td><td>检查 2026-08-08T00:00:00.000+08:00。</td></tr><tr><td>方案 C</td><td>信息最少。</td><td>解释不足。</td><td>检查脚注与来源轨。</td></tr></tbody></table></div><p class="compare-hint">横向滑动可查看全部比较维度。</p><p class="source-note">来源脚注：全部为合成演示内容，仅用于排版、适应性和可读性压力测试。</p>
    </div>
  </template>

  <script>
    function applyCase(frame, name) {
      const source = document.getElementById(`case-${name}`);
      const doc = frame.contentDocument;
      if (!source || !doc) return;
      const slide = doc.querySelector('.slide.active');
      if (!slide) return;
      slide.innerHTML = source.innerHTML;
      slide.scrollTop = 0;
      frame.dataset.ready = 'true';
    }
  </script>
</body>
</html>
